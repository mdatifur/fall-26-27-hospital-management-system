<!DOCTYPE html>

<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to Evercare Medical Center">
  <title>Login | Evercare Medical Center</title>
  <link rel="stylesheet" href="css/shohanStyle.css">
  <link rel="stylesheet" href="css/alifStyle.css">
  <link rel="stylesheet" href="css/saadStyle.css">
  <link rel="stylesheet" href="css/najirStyle.css">
</head>

<body>

  <header class="header">
    <a href="index.html" class="logo">Ever<span>care</span> Medical Center</a>
    <div class="user-info">
      <a href="login.html" class="btn btn-small btn-light">Login</a>
      <a href="register.html" class="btn btn-small">Register</a>
    </div>
  </header>

  <nav class="topnav">
    <a href="index.html">Home</a>
    <a href="index.html#search">Find a Doctor</a>
    <a href="index.html#who">Who It's For</a>
    <a href="index.html#how">How It Works</a>
    <a href="index.html#hours">Visiting Hours</a>
    <a href="index.html#contact">Contact Us</a>
  </nav>

  <main class="container">
    <div class="auth-box">

      <div class="card">
        <h2 class="page-title">Welcome back</h2>
        <p class="page-subtitle">One login for everyone: admins, doctors, receptionists and patients.
          We will open the right dashboard for your account.</p>

        <div id="loginMessage" class="message"></div>


        <form id="loginForm" action="index.html" method="get" onsubmit="return validateLogin()">
          <fieldset>
            <legend>Your account</legend>
            <table class="form-table">
              <tr>
                <td><label for="username">Username or Email:</label></td>
                <td>
                  <input type="text" id="username" name="username" placeholder="e.g. patient or farhan@mail.com">
                  <span class="error" id="usernameError"></span>
                </td>
              </tr>
              <tr>
                <td><label for="password">Password:</label></td>
                <td>
                  <input type="password" id="password" placeholder="Your password">
                  <span class="error" id="passwordError"></span>
                  <input type="checkbox" id="showPassword" onchange="togglePassword()">
                  <label for="showPassword" class="option-label">Show password</label>
                </td>
              </tr>
            </table>
          </fieldset>

          <input type="submit" class="btn btn-block" value="Login">
        </form>
